name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses and Install NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.3.11579264" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Rust with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle Retries and Network Timeouts
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          systemProp.org.gradle.internal.repository.max.retries=10
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.http.connectionTimeout=60000
          EOF

      - name: Install Frontend Dependencies and Build Android APK
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/26.3.11579264
        run: |
          npm install --ignore-scripts
          npx @tauri-apps/cli android init --ci
          cd src-tauri/gen/android
          for i in 1 2 3 4 5; do ./gradlew --version && break || sleep 5; done
          for i in 1 2 3 4 5; do ./gradlew tasks --dry-run && break || sleep 5; done
          cd ../../..
          npx @tauri-apps/cli android build --apk --ci

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-manager-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
