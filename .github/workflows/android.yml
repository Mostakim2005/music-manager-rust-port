name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses and Install NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.3.11579264" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Rust with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle Retries and Network Timeouts
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          systemProp.org.gradle.internal.repository.max.retries=10
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.http.connectionTimeout=60000
          EOF

      - name: Install Frontend Dependencies and Build Android APK
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/26.3.11579264
        run: |
          npm install --ignore-scripts
          npx @tauri-apps/cli android init --ci
          cd src-tauri/gen/android
          for i in 1 2 3 4 5; do ./gradlew --version && break || sleep 5; done
          for i in 1 2 3 4 5; do ./gradlew tasks --dry-run && break || sleep 5; done
          cd ../../..
          npx @tauri-apps/cli android build --apk --ci

      - name: Align and Sign Release APK
        run: |
          BUILD_TOOLS=/usr/local/lib/android/sdk/build-tools/34.0.0
          APK_RAW=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" -o -name "*release.apk" | head -n 1)
          if [ -n "$APK_RAW" ]; then
            echo "Aligning and signing $APK_RAW..."
            keytool -genkey -v -keystore release-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MusicManager, OU=Mobile, O=MusicManager, C=US"
            $BUILD_TOOLS/zipalign -v -p 4 "$APK_RAW" app-aligned.apk
            mkdir -p dist-release
            VERSION=$(node -p "require('./package.json').version || '0.0.0'")
            SHA=$(git rev-parse --short=7 HEAD)
            BRANCH="${GITHUB_REF_NAME:-main}"
            SLUG=$(echo "$BRANCH" | sed -E 's/[^a-zA-Z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')
            PREFIX="MusicManager-Rust-Tauri-v${VERSION}-branch-${SLUG}-${SHA}"
            $BUILD_TOOLS/apksigner sign --ks release-debug.keystore --ks-pass pass:android --key-pass pass:android --out "dist-release/${PREFIX}-Android-Universal.apk" app-aligned.apk
            $BUILD_TOOLS/apksigner verify --verbose "dist-release/${PREFIX}-Android-Universal.apk"
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-manager-android-apk
          path: |
            dist-release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist-release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
