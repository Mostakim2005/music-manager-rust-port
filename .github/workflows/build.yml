name: Build Portable Release (Legacy Electron)

# Manual fallback for legacy Electron builds.
# Tag-triggered releases are handled by build-release.yml (Tauri v2 + Rust).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Generates the gitignored auto-import/component type stubs that the
      # type checks require on a fresh checkout, and catches bundle errors early.
      - name: Build bundle (generates type stubs)
        run: npm run build

      - name: Type checks
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: English sweep gate
        run: node .sweep-gate.mjs

      - name: Build portable .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:portable

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:installer

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*-Portable.exe
            dist/*-Setup.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-Portable.exe
            dist/*-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
