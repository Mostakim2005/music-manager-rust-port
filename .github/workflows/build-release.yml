name: 'Build Windows (.exe) and Android (.apk)'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (all, windows, android)'
        required: false
        default: 'all'
      release_tag:
        description: 'GitHub Release Tag to attach to'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name == 'push' || github.event.inputs.target != 'android'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch Windows Sidecars (yt-dlp & ffmpeg)
        shell: pwsh
        run: |
          node scripts/fetch-binaries.mjs
          New-Item -ItemType Directory -Force -Path "src-tauri/bin"
          if (Test-Path "resources/bin/yt-dlp.exe") {
            Copy-Item "resources/bin/yt-dlp.exe" "src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe"
          } else {
            curl.exe -L --retry 3 "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -o "src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe"
          }
          if (Test-Path "resources/bin/ffmpeg.exe") {
            Copy-Item "resources/bin/ffmpeg.exe" "src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe"
          } else {
            curl.exe -L --retry 3 "https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-win32-x64" -o "src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe"
          }

      - name: Install Frontend Dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --ignore-scripts

      - name: Verify Types and Tests
        run: |
          npm run build:vite
          npm run typecheck
          npm test
          node .sweep-gate.mjs

      - name: Build Windows Tauri v2 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v2.0.0' }}
          releaseName: 'Music Manager ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v2.0.0' }} (Tauri v2 + Rust)'
          releaseBody: 'Release ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v2.0.0' }}: High-performance Tauri v2 + Rust edition with Namida glassmorphic UI, ambient audio-reactive mesh canvas, and linked AV sync.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --config src-tauri/tauri.windows.conf.json

      - name: Package Portable Executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-portable"
          if (Test-Path "src-tauri/target/release/music-manager.exe") {
            Copy-Item "src-tauri/target/release/music-manager.exe" "dist-portable/MusicManager-v2.0.0-Portable.exe"
            Copy-Item "src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe" "dist-portable/yt-dlp.exe"
            Copy-Item "src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe" "dist-portable/ffmpeg.exe"
            Compress-Archive -Path "dist-portable/*" -DestinationPath "dist-portable/MusicManager-v2.0.0-Windows-Portable.zip"
          }

      - name: Attach Portable Zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v2.0.0' }}
          files: |
            dist-portable/MusicManager-v2.0.0-Windows-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    needs: build-windows
    if: always() && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') && (github.event_name == 'push' || github.event.inputs.target != 'windows')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.3.11579264" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Rust with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies & Build Android APK
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/26.3.11579264
        run: |
          npm install --ignore-scripts
          npx @tauri-apps/cli android init --ci
          npx @tauri-apps/cli android build --apk --ci

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-manager-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v2.0.0' }}
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
