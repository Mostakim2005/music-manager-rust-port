name: Build Windows (.exe) & Android (.apk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch Windows Sidecars (yt-dlp & ffmpeg)
        shell: pwsh
        run: |
          node scripts/fetch-binaries.mjs
          New-Item -ItemType Directory -Force -Path "src-tauri/bin"
          if (Test-Path "resources/bin/yt-dlp.exe") {
            Copy-Item "resources/bin/yt-dlp.exe" "src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe"
          } else {
            curl.exe -L --retry 3 "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -o "src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe"
          }
          if (Test-Path "resources/bin/ffmpeg.exe") {
            Copy-Item "resources/bin/ffmpeg.exe" "src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe"
          } else {
            curl.exe -L --retry 3 "https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-win32-x64" -o "src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe"
          }

      - name: Install Frontend Dependencies
        run: npm install

      - name: Verify Types and Tests
        run: |
          npm run build:vite
          npm run typecheck
          npm test
          node .sweep-gate.mjs

      - name: Build Windows Tauri v2 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v2.0.0
          releaseName: 'Music Manager v2.0.0 (Tauri v2 + Rust)'
          releaseBody: 'Release v2.0.0: High-performance Tauri v2 + Rust edition with Namida glassmorphic UI, ambient audio-reactive mesh canvas, and linked AV sync.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --config src-tauri/tauri.windows.conf.json

      - name: Package Portable Executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-portable"
          if (Test-Path "src-tauri/target/release/music-manager.exe") {
            Copy-Item "src-tauri/target/release/music-manager.exe" "dist-portable/MusicManager-v2.0.0-Portable.exe"
            Copy-Item "src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe" "dist-portable/yt-dlp.exe"
            Copy-Item "src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe" "dist-portable/ffmpeg.exe"
            Compress-Archive -Path "dist-portable/*" -DestinationPath "dist-portable/MusicManager-v2.0.0-Windows-Portable.zip"
          }

      - name: Attach Portable Zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-portable/MusicManager-v2.0.0-Windows-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    needs: build-windows
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r26d
        run: sdkmanager --install "ndk;26.3.11579264"

      - name: Setup Rust with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies & Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          npm install
          npx @tauri-apps/cli android init --ci
          npx @tauri-apps/cli android build --apk true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-manager-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
